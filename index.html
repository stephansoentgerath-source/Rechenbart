<!DOCTYPE html>
<html lang="de">
<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#22313a;overflow:hidden;font-family:Andika,"Trebuchet MS",Verdana,sans-serif;color:#2b2a33}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center;overflow:hidden;background:#fbeed3}
#scene,#panel,#title,#eltern{position:absolute;left:0;top:0;width:1280px}
#scene{height:620px}
#scene svg{display:block;width:1280px;height:620px}
.hot{cursor:pointer;fill:transparent}
.mark{transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}
.mark.done{animation:none}
@keyframes pulse{50%{transform:scale(1.25)}}
.walk .bob{animation:bob .3s linear infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
#hud{position:absolute;right:14px;top:12px;display:flex;gap:10px;z-index:6}
#hud button{font:inherit;font-size:20px;padding:8px 14px;border-radius:12px;border:2px solid #2b2a33;background:#fbeed3cc}
#bar{position:absolute;left:0;top:620px;width:1280px;height:180px;background:#3a2c20;border-top:6px solid #2b2a33;display:flex;align-items:center;gap:18px;padding:12px 18px;color:#fbeed3;z-index:5}
.port{width:150px;height:150px;border-radius:18px;background:#fbeed3;border:4px solid #2b2a33;flex:none;overflow:hidden}
.port svg{width:100%;height:100%}
.say{flex:1;min-width:0}
.nm{font-size:20px;color:#f6c84a;font-weight:700;margin-bottom:2px}
.tx{font-size:31px;line-height:1.28}
.tx span.hl{background:#f6c84a;color:#2b2a33;border-radius:6px}
.bb{display:flex;flex-direction:column;gap:12px;flex:none}
.btn{font:inherit;font-weight:700;font-size:28px;padding:12px 24px;border-radius:16px;border:3px solid #2b2a33;background:#f6c84a;color:#2b2a33;box-shadow:0 5px 0 #2b2a33;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2b2a33}
.btn.sec{background:#fbeed3}
.btn.small{font-size:22px;padding:8px 16px;background:#fbeed3}
.idle{display:flex;gap:26px;align-items:center;font-size:28px}
.coin{display:inline-block;width:34px;height:34px;border-radius:50%;background:#f6c84a;border:3px solid #a9793f;vertical-align:-7px;margin-right:8px}
.stat{background:#2b2118;border-radius:14px;padding:10px 16px;white-space:nowrap}
#panel{height:620px;background:#fbeed3;display:none;padding:22px 36px;z-index:4}
.ptitle{padding-right:190px;font-size:30px;font-weight:700;color:#8e3b3b;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dots{letter-spacing:6px;color:#a9793f;font-size:26px}
.num{display:flex;gap:30px;height:100%}
.numl{flex:1}
.story{font-size:34px;line-height:1.35;margin:10px 0 18px}
.eq{font-size:66px;font-weight:700;margin-bottom:12px}
.ans{display:inline-block;min-width:150px;text-align:center;border:4px dashed #a9793f;border-radius:14px;padding:0 12px;background:#fff}
.ans.good{background:#bfe6b0;border-style:solid;border-color:#4f9a4a}
.ans.bad{background:#f3c0bb}
.hint{min-height:110px;font-size:26px;color:#3a2c20}
.blk{display:inline-flex;align-items:flex-end;gap:5px;margin-right:34px;vertical-align:bottom}
.ten{width:15px;height:90px;background:repeating-linear-gradient(#3b78c4 0 8px,#2c5f9e 8px 9px);border-radius:3px}
.one{width:15px;height:15px;background:#d24a43;border-radius:3px}
.pad{display:grid;grid-template-columns:repeat(3,116px);grid-auto-rows:116px;gap:14px;align-content:center;flex:none}
.key{font:inherit;font-size:48px;font-weight:700;border-radius:18px;border:3px solid #2b2a33;background:#fff;box-shadow:0 5px 0 #2b2a33}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #2b2a33}
.key.ok{background:#8fc640;font-size:36px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.kan{position:relative;height:500px}
.ball{position:absolute;left:40px;top:150px;width:300px;height:200px;border-radius:100px;background:#2b2a33;color:#fff;font-size:46px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .5s ease-in,background .2s;z-index:2}
.faesser{position:absolute;right:20px;top:110px;display:flex;gap:26px}
.fass{font:inherit;font-size:54px;font-weight:700;color:#fff;width:210px;height:280px;border-radius:40px/60px;border:5px solid #2b2a33;box-shadow:0 7px 0 #2b2a33}
.fass:disabled{opacity:.35}
.sign{margin:50px auto 40px;width:max-content;background:#a9793f;border:6px solid #6d4a26;border-radius:18px;padding:16px 50px;font-size:110px;font-weight:700;color:#fff8e6;display:flex;align-items:center}
.gap{display:inline-block;min-width:110px;text-align:center;border-bottom:8px solid #fff8e6;margin:0 8px;padding:0 6px}
.gap.good{color:#d3f5b5;border-color:transparent}
.opts{display:flex;gap:34px;justify-content:center;margin-bottom:26px}
.plank{font-size:60px;min-width:190px;padding:18px 30px}
.plank:disabled{opacity:.3}
.center{text-align:center}
.kwrap{display:flex;gap:40px;align-items:center;justify-content:center}
.merk{font-size:34px;line-height:1.5;background:#fff;border:4px solid #a9793f;border-radius:18px;padding:20px 28px}
.merk b{color:#d24a43;font-size:44px}
.komp{position:relative;width:480px;height:480px;flex:none}
.komp svg{position:absolute;left:80px;top:80px;width:320px;height:320px}
.slot{position:absolute;width:88px;height:88px;border-radius:50%;font:inherit;font-size:44px;font-weight:700;border:4px solid #2b2a33;background:#fff;box-shadow:0 5px 0 #2b2a33}
.slot.ok{background:#f6c84a}
.orderwrap{display:flex;gap:36px;height:100%;align-items:center}
.zettel{flex:1;background:#fff8e6;border:3px solid #a9793f;border-radius:6px;padding:26px 30px;transform:rotate(-2deg);box-shadow:4px 6px 0 #0002}
.zt{font-size:24px;color:#8e3b3b;font-weight:700}
.zettel p{font-size:40px;line-height:1.4;margin:14px 0}
.zettel .sig{font-size:28px;text-align:right;font-style:italic}
.board{width:560px;flex:none;background:#2f3b3a;border:12px solid #6d4a26;border-radius:10px;padding:14px 20px 18px;color:#f4efe4}
.bt{font-size:32px;font-weight:700;text-align:center;margin-bottom:8px;color:#f6c84a}
.row{font:inherit;font-size:31px;color:inherit;display:flex;justify-content:space-between;width:100%;background:transparent;border:3px solid transparent;border-radius:12px;padding:9px 14px;margin:3px 0}
.row.sel{border-color:#f6c84a;background:#ffffff18}
.row.good{background:#4f9a4a}
.log{display:flex;flex-direction:column;align-items:center;justify-content:center;height:500px;gap:26px;text-align:center}
.lword{font-size:120px;font-weight:700}
.ltext{font-size:38px}
.timer{width:520px;height:16px;background:#e5d3ae;border-radius:8px;overflow:hidden}
.timer i{display:block;height:100%;background:#8e3b3b;width:100%;transition:width 5s linear}
.lrow{display:flex;gap:30px}
.bigmsg{font-size:52px;font-weight:700;color:#8e3b3b;margin:6px 0}
#title{height:800px;z-index:8;background:linear-gradient(#bfe3ee 0,#fbeed3 55%,#4a9aa6 55%,#3f8f9c 100%)}
#title h1{position:absolute;left:0;right:0;top:54px;margin:0;text-align:center;font-size:70px;line-height:1.1;color:#8e3b3b}
#title h1 small{display:block;font-size:34px;color:#2b2a33;font-weight:400}
#title svg{position:absolute;left:0;top:0;width:1280px;height:800px}
.tbtns{position:absolute;left:0;right:0;top:330px;display:flex;flex-direction:column;align-items:center;gap:22px}
.tbtns .btn.big{font-size:52px;padding:20px 70px}
#pbtn{position:absolute;right:20px;bottom:18px;font-size:18px;padding:6px 12px}
#eltern{height:800px;z-index:9;background:#22313aee;display:none;align-items:center;justify-content:center}
.ecard{background:#fbeed3;border-radius:20px;padding:26px 38px;width:820px;font-size:24px}
.ecard h2{margin:0 0 10px;color:#8e3b3b}
.ecard label{display:block;margin:8px 0}
.ecard input{width:26px;height:26px;vertical-align:-4px;margin-right:10px}
.ecard .lrow{margin-top:16px;gap:14px;flex-wrap:wrap}

</head>
<body>

<script>
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rand(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Spielstand ---------- */
const KEY='rechenbart-k1';
let S={coins:0,done:{},lists:[1,2,3],speak:true,log:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}

/* ---------- Lernwörter ---------- */

 [1,'Ochse','der',['O','chs','e'],X],[1,'sechs',0,['se','chs',''],X],
 [2,'Spiel','das',['','Sp','iel'],SP],[2,'Spur','die',['','Sp','ur'],SP],[2,'Spitze','die',['Spi','tz','e'],['tz','z','ts']],
 [2,'Spaß','der',['Spa','ß',''],SZ],[2,'Spiegel','der',['Sp','ie','gel'],['ie','i','ih']],[2,'Stein','der',['','St','ein'],ST],
 [2,'Stunde','die',['','St','unde'],ST],[2,'Strahl','der',['Stra','h','l'],['h','hh','ch']],[2,'Stuhl','der',['','St','uhl'],ST],

 [3,'Farbe','die',['Far','b','e'],['b','p','w']],[3,'Fuß','der',['Fu','ß',''],SZ],[3,'Ohr','das',['O','h','r'],['h','hh','ch']],
 [3,'Rüssel','der',['Rü','ss','el'],['ss','s','ß']],[3,'rennen',0,['re','nn','en'],['nn','n','mm']]
].map(a=>({l:a[0],w:a[1],a:a[2],g:a[3],o:a[4]}));

const PORT={moritz:`<svg viewBox="-62 -268 124 124">${moritz()}</svg>`,kapitaen:`<svg viewBox="-90 -352 180 180">${kapitaen()}</svg>`,
 kruemel:`<svg viewBox="-50 -128 112 112">${kruemel()}</svg>`,olga:`<svg viewBox="-72 -240 144 144">${olga()}</svg>`};
const NAME={moritz:'Moritz',kapitaen:'Kapitän Rechenbart',kruemel:'Krümel',olga:'Wirtin Olga'};
const PITCH={kapitaen:.6,kruemel:1.6,olga:1.15,moritz:1};

/* ---------- Szenen ---------- */
const mark=(id,x,y)=>`<g id="m-${id}" class="mark" transform="translate(${x},${y})"><circle r="24" fill="#f6c84a" stroke="#2b2a33" stroke-width="4"/><text y="12" text-anchor="middle" font-size="34" font-weight="700" fill="#2b2a33">!</text></g>`;
const HARBOR=`<svg id="harbor" viewBox="0 0 1280 620">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ee"/><stop offset="1" stop-color="#fbeed3"/></linearGradient></defs>
<rect width="1280" height="320" fill="url(#sky)"/><circle cx="880" cy="90" r="50" fill="#f8d66b"/>
<g fill="#fff" opacity=".85"><ellipse cx="420" cy="80" rx="90" ry="22"/><ellipse cx="480" cy="62" rx="60" ry="20"/><ellipse cx="720" cy="150" rx="70" ry="16"/></g>
<path d="M500 302Q640 205 800 302Z" fill="#7fb07a"/><path d="M660 252q8 -36 0 -62" stroke="#8c6234" stroke-width="7" fill="none"/>

<rect y="300" width="1280" height="320" fill="#4a9aa6"/>
<g stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none"><path d="M430 340q15 -8 30 0t30 0"/><path d="M620 380q15 -8 30 0t30 0"/><path d="M840 335q15 -8 30 0t30 0"/><path d="M500 410q15 -8 30 0t30 0"/></g>

/* ---------- Sprache ---------- */
let voice=null;const hasTTS='speechSynthesis' in window;
function loadVoice(){try{voice=speechSynthesis.getVoices().find(v=>/^de/i.test(v.lang))||null}catch(e){}}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function hush(){if(hasTTS)try{speechSynthesis.cancel()}catch(e){}}
function speak(text,who,onword){hush();if(!S.speak||!hasTTS)return;
 try{const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.9;u.pitch=PITCH[who]||1;
 if(onword)u.onboundary=e=>onword(e.charIndex);speechSynthesis.speak(u)}catch(e){}}

/* ---------- Leiste unten ---------- */
function spans(t){let i=0;return t.split(' ').map(w=>{const s=`<span data-c="${i}">${w}</span>`;i+=w.length+1;return s}).join(' ')}
function hl(ci){let cur=null;$$('#bar .tx span').forEach(s=>{s.classList.remove('hl');if(+s.dataset.c<=ci)cur=s});if(cur)cur.classList.add('hl')}
function barHtml(who,text,btns){$('#bar').innerHTML=`<div class="port">${PORT[who]}</div><div class="say"><div class="nm">${NAME[who]}</div><div class="tx">${spans(text)}</div></div><div class="bb">${btns.map((b,i)=>`<button class="btn${i?' sec':''}" data-b="${i}">${b}</button>`).join('')}</div>`}
function talk(who,text,btns){btns=btns||['Weiter'];return new Promise(res=>{barHtml(who,text,btns);speak(text,who,hl);
 $$('#bar .btn').forEach(b=>b.onclick=()=>{hush();res(+b.dataset.b)})})}
function note(who,text){barHtml(who,text,[]);speak(text,who,hl)}
async function brief(text){while(await talk('kruemel',text+' Alles klar, Käpt’n?',['Ja!','Nochmal hören']));}
function idle(){const d=S.done,n=['kisten','kanonen','kompass'].filter(k=>d[k]).length;
 const t=!d.intro?'':n<3?'Tippe auf ein Ausrufezeichen im Hafen!':!d.karte?'Geh zur Kneipe!':!d.logbuch?'Bring das Essen zum Kapitän!':'Kapitel 1 geschafft! Du kannst alles nochmal üben.';
 $('#bar').innerHTML=`<div class="port">${PORT.moritz}</div><div class="say"><div class="idle"><span class="stat"><i class="coin"></i>${S.coins} Dublonen</span><span class="stat">Kartenstücke: ${d.karte?1:0} von 5</span></div><div class="tx" style="margin-top:10px">${t}</div></div>`;
 [['kisten',d.kisten],['kanonen',d.kanonen],['kompass',d.kompass],['tuer',d.karte]].forEach(([k,ok])=>{const m=$('#m-'+k);if(!m)return;m.classList.toggle('done',!!ok);m.querySelector('text').textContent=ok?'★':'!';
  m.style.display=(k==='tuer'&&n<3)?'none':''});
 const mk=$('#m-kapitaen');if(mk)mk.style.display=(d.karte&&!d.logbuch)?'':'none';
 $('#b-home').style.display='';save()}
const WRONG=['Kräh! Knapp daneben. Versuch es nochmal!','Hoppla! Da ist ein Krümel verrutscht. Nochmal!','Fast! Probier es noch einmal.'];
const RIGHT=['Kräh! Richtig!','Volltreffer, Käpt’n!','Stark gemacht!'];
const panel=h=>{const p=$('#panel');p.innerHTML=h;p.style.display='block'};
const closePanel=()=>{$('#panel').style.display='none';$('#panel').innerHTML=''};
const dots=(i,n)=>`<span class="dots">${'●'.repeat(i)}${'○'.repeat(n-i)}</span>`;

/* ---------- Rechnen ---------- */
const blocks=n=>`<span class="blk">${'<i class="ten"></i>'.repeat(Math.floor(n/10))}${'<i class="one"></i>'.repeat(n%10)}</span>`;
function stepHint(a,op,b){const t=Math.floor(b/10)*10,o=b%10;
 if(op==='+'){if(!t&&a%10+b<10)return `Tipp: Rechne nur die Einer: ${a%10} + ${b} = ${a%10+b}.`;if(!t){const f=10-a%10;return `Tipp: ${a} + ${f} = ${a+f}. Dann noch + ${b-f}.`}return `Tipp: Rechne erst ${a} + ${t} = ${a+t}. Dann noch + ${o}.`}
 if(!t&&a%10>=b)return `Tipp: Rechne nur die Einer: ${a%10} − ${b} = ${a%10-b}.`;if(!t){const f=a%10;return f?`Tipp: ${a} − ${f} = ${a-f}. Dann noch − ${b-f}.`:`Tipp: Zähle von ${a} rückwärts.`}
 return o?`Tipp: Rechne erst ${a} − ${t} = ${a-t}. Dann noch − ${o}.`:`Tipp: Nimm ${t/10} Zehner weg.`}
function askNumber(title,text,a,op,b){return new Promise(res=>{const ans=op==='+'?a+b:a-b;let val='',tries=0,lock=false;
 panel(`<div class="num"><div class="numl"><div class="ptitle">${title}</div><p class="story">${text}</p><div class="eq">${a} ${op==='+'?'+':'−'} ${b} = <span id="ans" class="ans">?</span></div><div id="hint" class="hint"></div><button class="btn small" id="again">Nochmal hören</button></div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button class="key${k==='OK'?' ok':''}" data-k="${k}">${k}</button>`).join('')}</div></div>`);
 note('kruemel','Tippe die Zahl ein. Dann drücke OK.');speak(text,'kruemel');
 $('#again').onclick=()=>speak(text,'kruemel');const A=$('#ans');
 $$('.key').forEach(k=>k.onclick=()=>{if(lock)return;const c=k.dataset.k;A.classList.remove('bad');
  if(c==='⌫')val=val.slice(0,-1);else if(c==='OK'){if(!val)return;
   if(+val===ans){lock=true;A.classList.add('good');note('kruemel',pick(RIGHT));setTimeout(res,1400)}
   else{tries++;A.classList.add('bad');val='';note('kruemel',pick(WRONG));
    $('#hint').innerHTML=tries===1?(op==='+'?blocks(a)+blocks(b):blocks(a)+`<span>Nimm ${b} weg.</span>`):stepHint(a,op,b);
    setTimeout(()=>{A.textContent='?';A.classList.remove('bad')},700);return}}
  else if(val.length<3)val+=c;A.textContent=val||'?'})})}
async function kisten(){await brief('Der Kapitän will wissen, wie viele Kekse er hat. Rechne aus. Tippe die Zahl ein und drücke OK.');
 for(let i=0;i<3;i++){let a,b;if(i<2){if(i===0){do{a=rand(12,75);b=rand(2,8)}while(a%10+b>9)}else{do{a=rand(14,68);b=rand(3,9)}while(a%10+b<10)}
   await askNumber('Kekskisten '+dots(i,3),`In der ersten Kiste sind ${a} Kekse. In der zweiten Kiste sind ${b} Kekse. Wie viele Kekse sind es zusammen?`,a,'+',b)}
  else{do{a=rand(25,89);b=rand(2,8)}while(a%10<b);
   await askNumber('Kekskisten '+dots(i,3),`In der Kiste waren ${a} Kekse. Krümel hat heimlich ${b} Kekse gefressen! Wie viele Kekse sind noch da?`,a,'-',b)}}
 closePanel();await reward('kisten',30)}
async function reward(k,n){if(!S.done[k]){S.done[k]=1;S.coins+=n;save();await talk('kruemel',`Geschafft! Du bekommst ${n} Dublonen.`)}else await talk('kruemel','Super geübt, Käpt’n!')}

/* ---------- Artikel-Kanone ---------- */
async function kanonen(){await brief('Jedes Wort gehört in ein Fass. Der ist blau. Die ist rot. Das ist grün. Tippe auf das richtige Fass.');
 let ns=pickWords(8,w=>w.a);const das=pool().filter(w=>w.a==='das'&&!ns.includes(w));das.forEach((w,i)=>{if(ns.length>i+1)ns[ns.length-1-i]=w});ns=shuffle(ns);
 for(let i=0;i<ns.length;i++)await new Promise(res=>{const w=ns[i];let lock=false;
  panel(`<div class="ptitle">Artikel-Kanone ${dots(i,ns.length)}</div><div class="kan"><div class="ball" id="ball">${w.w}</div><div class="faesser">${['der','die','das'].map(a=>`<button class="fass" data-a="${a}" style="background:${ART[a]}">${a}</button>`).join('')}</div></div>`);
  note('kruemel','Der, die oder das?');speak(w.w,'kruemel');
  $$('.fass').forEach(b=>b.onclick=()=>{if(lock)return;const ball=$('#ball');
   if(b.dataset.a===w.a){lock=true;ball.textContent=w.a+' '+w.w;ball.style.background=ART[w.a];
    const f=b.parentNode,dx=f.offsetLeft+b.offsetLeft+b.offsetWidth/2-(ball.offsetLeft+ball.offsetWidth/2);
    ball.style.transform=`translate(${dx}px,-150px) scale(.72)`;speak(w.a+' '+w.w,'kruemel');setTimeout(res,1700)}
   else{b.classList.add('shake');b.disabled=true;note('kruemel',pick(WRONG))}})});
 closePanel();await reward('kanonen',20)}

/* ---------- Wortlücken ---------- */
async function gaps(n,title){const ws=pickWords(n);for(let i=0;i<ws.length;i++)await gapOne(ws[i],title+' '+dots(i,ws.length));closePanel()}
function gapOne(w,title){return new Promise(res=>{let lock=false,first=true;
  panel(`<div class="ptitle">${title}</div><div class="sign"><span>${w.g[0]}</span><span class="gap" id="gap">&nbsp;</span><span>${w.g[2]}</span></div>
  <div class="opts">${shuffle(w.o).map(o=>`<button class="btn plank" data-o="${o}">${o}</button>`).join('')}</div><div class="center"><button class="btn small" id="again">Wort hören</button></div>`);
  note('kruemel','Welches Stück fehlt?');speak(w.w,'kruemel');$('#again').onclick=()=>speak(w.w,'kruemel');
  $$('.plank').forEach(b=>b.onclick=()=>{if(lock)return;
   if(b.dataset.o===w.g[1]){lock=true;const g=$('#gap');g.textContent=w.g[1];g.classList.add('good');speak(w.w,'kruemel');setTimeout(()=>res(first),1500)}
   else{first=false;b.classList.add('shake');b.disabled=true;note('kruemel',pick(WRONG))}})})}

/* ---------- Kompass ---------- */
async function kompass(){await brief('Der Kompass hat seine Buchstaben verloren. Norden ist immer oben. Dann geht es im Kreis herum: Norden, Osten, Süden, Westen.');
 await new Promise(res=>{const P={N:[196,0],O:[392,196],S:[196,392],W:[0,196]};
  const qs=[['N','Wo ist Norden? Tippe auf den Kreis.',1],['O','Wo ist Osten?',1],['S','Wo ist Süden?',1],['W','Wo ist Westen?',1],['O','Die Sonne geht im Osten auf. Tippe auf Osten!'],['W','Die Sonne geht im Westen unter. Tippe auf Westen!']];
  panel(`<div class="ptitle"><span id="kq"></span></div><div class="kwrap"><div class="merk">Merksatz:<br><b>N</b>ie <b>O</b>hne <b>S</b>eife <b>W</b>aschen</div>
  <div class="komp"><svg viewBox="-110 -110 220 220"><circle r="104" fill="#f4efe4" stroke="#2b2a33" stroke-width="6"/><circle r="84" fill="none" stroke="#a9793f" stroke-width="2"/>
  <path d="M0 -84L16 0L0 84L-16 0Z" fill="#d9a55a"/><path d="M-84 0L0 -16L84 0L0 16Z" fill="#d9a55a"/><path d="M0 -84L16 0H-16Z" fill="#d24a43"/><circle r="9" fill="#2b2a33"/></svg>
  ${Object.keys(P).map(d=>`<button class="slot" data-d="${d}" style="left:${P[d][0]}px;top:${P[d][1]}px">?</button>`).join('')}</div></div>`);
  let qi=0,lock=false;const ask=()=>{$('#kq').textContent=qs[qi][1];note('kruemel',qs[qi][1])};ask();
  $$('.slot').forEach(b=>b.onclick=()=>{if(lock)return;const q=qs[qi];
   if(b.dataset.d===q[0]){if(q[2]){b.textContent=q[0];b.classList.add('ok')}lock=true;speak(pick(RIGHT),'kruemel');
    setTimeout(()=>{lock=false;qi++;qi<qs.length?ask():res()},1300)}
   else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450);note('kruemel',pick(WRONG))}})});
 closePanel();await reward('kompass',10)}

/* ---------- Kneipe ---------- */
const MENU=[['Keks-Suppe',7],['Hexen-Limo',4],['Stiefel-Eintopf',12],['Fuchs-Nudeln',9],['Sechs Kekse',6,'sechs Kekse'],['Mixer-Saft',5]];
const ORDERS=[[2,4],[3,1],[0,5],[2,1],[3,0]];
function order(o){return new Promise(res=>{const t=`Ich möchte ${MENU[o[0]][2]||MENU[o[0]][0]} und ${MENU[o[1]][2]||MENU[o[1]][0]}.`;let sel=[],lock=false;
 panel(`<div class="orderwrap"><div class="zettel"><div class="zt">Bestellung</div><p>${t}</p><p class="sig">Dein Kapitän</p><button class="btn small" id="zh">Krümel hilft lesen</button></div>
 <div class="board"><div class="bt">Speisekarte</div>${MENU.map((m,i)=>`<button class="row" data-i="${i}"><span>${m[0]}</span><span>${m[1]}</span></button>`).join('')}</div></div>`);
 note('kruemel','Lies den Zettel selbst. Tippe dann auf der Karte an, was der Kapitän möchte.');$('#zh').onclick=()=>speak(t,'kruemel');
 $$('.row').forEach(r=>r.onclick=()=>{if(lock)return;const i=+r.dataset.i;if(sel.includes(i)){sel=sel.filter(x=>x!==i);r.classList.remove('sel');return}
  sel.push(i);r.classList.add('sel');if(sel.length<2)return;lock=true;
  if(o.every(x=>sel.includes(x))){$$('.row.sel').forEach(x=>x.classList.add('good'));note('kruemel',pick(RIGHT));setTimeout(res,1500)}
  else{note('kruemel','Kräh! Das wollte er nicht. Lies den Zettel nochmal genau.');setTimeout(()=>{$$('.row').forEach(x=>x.classList.remove('sel'));sel=[];lock=false},900)}})})}
async function pub(){$('#harbor').style.display='none';$('#pub').style.display='';$('#b-home').style.display='none';
 if(S.done.karte){if(await talk('olga','Schön, dich zu sehen, Moritz! Willst du nochmal meine Speisekarte flicken?',['Ja!','Nein'])===0)await gaps(8,'Speisekarte flicken')}
 else{await talk('olga','Ahoi Moritz! Ich bin Olga. Oh nein! Krümel hat Löcher in meine Speisekarte gepickt!');
  await talk('kruemel','Kräh! Die Karte sah aus wie ein Keks!');
  await brief('Hilf Olga! In jedem Wort fehlt ein Stück. Tippe auf das richtige Stück.');
  await gaps(8,'Speisekarte flicken');
  await talk('olga','Danke! Jetzt ist die Karte wieder heil.');
  await talk('kruemel','Der Kapitän hat Hunger. Hier ist sein Zettel. Den liest du selbst!');
  const o=pick(ORDERS),a=MENU[o[0]],b=MENU[o[1]],sum=a[1]+b[1];await order(o);
  await askNumber('Bezahlen',`${a[0]}: ${a[1]} Dublonen. ${b[0]}: ${b[1]} Dublonen. Was kostet das zusammen?`,a[1],'+',b[1]);
  await askNumber('Wechselgeld',`Du gibst Olga 20 Dublonen. Das Essen kostet ${sum} Dublonen. Wie viele Dublonen bekommst du zurück?`,20,'-',sum);
  closePanel();S.coins-=sum;S.done.karte=1;save();
  await talk('olga','Stimmt genau! Hier ist das Essen. Und schau mal, was unter meinem Tresen lag!');
  panel(`<div class="log"><div class="bigmsg">Ein Stück der Schatzkarte!</div>${MAP}<div class="ltext">Kartenstück 1 von 5</div></div>`);
  await talk('kruemel','Kräh! Das erste Kartenstück! Bring jetzt schnell das Essen zum Kapitän.',['Juhu!'])}
 closePanel();$('#pub').style.display='none';$('#harbor').style.display=''}

/* ---------- Logbuch (auf Papier schreiben) ---------- */
async function logbuch(n){let q=pickWords(n),again=new Set();
 while(q.length){const w=q.shift(),ok=await logOne(w,'Logbuch');
  if(!ok&&!again.has(w.w)){again.add(w.w);q.push(w);await talk('kruemel','Macht nichts! Das Wort üben wir gleich nochmal.')}}
 closePanel()}
async function logOne(w,ti){
  panel(`<div class="ptitle">${ti}</div><div class="log"><div class="lword">${w.w}</div><div class="timer"><i id="ti"></i></div><div class="ltext">Schau dir das Wort genau an!</div></div>`);
  note('kruemel','Schau genau hin. Gleich ist das Wort weg!');speak(w.w,'kruemel');await wait(60);$('#ti').style.width='0';await wait(5000);
  panel(`<div class="ptitle">${ti}</div><div class="log"><div class="ltext">Schreib das Wort auf dein Papier!</div><div class="lrow"><button class="btn" id="lf">Fertig!</button><button class="btn sec" id="lh">Wort hören</button></div></div>`);
  note('kruemel','Schreib das Wort auf dein Papier. Tippe dann auf Fertig.');$('#lh').onclick=()=>speak(w.w,'kruemel');
  await new Promise(r=>$('#lf').onclick=r);
  panel(`<div class="ptitle">${ti}</div><div class="log"><div class="lword">${w.w}</div><div class="ltext">Vergleiche Buchstabe für Buchstabe.</div><div class="lrow"><button class="btn" id="ly">Richtig!</button><button class="btn sec" id="ln">Noch nicht</button></div></div>`);
  note('kruemel','Hast du es genauso geschrieben?');
  const ok=await new Promise(r=>{$('#ly').onclick=()=>r(true);$('#ln').onclick=()=>r(false)});
  const st=S.log[w.w]||(S.log[w.w]=[0,0]);st[ok?0:1]++;save();return ok}

/* ---------- Lernwörter-Training (Testvorbereitung) ---------- */
const BLATT={1:'Blatt 1: x und chs',2:'Blatt 2: Sp und St',3:'Blatt 3: Farben',0:'Alle Wörter'};
const lvl=w=>Math.min(2,(S.mw||{})[w.w]||0);
function artOne(w){return new Promise(res=>{let lock=false;
 panel(`<div class="ptitle">Der, die oder das?</div><div class="kan"><div class="ball" id="ball" style="left:60px">${w.w}</div><div class="faesser">${['der','die','das'].map(a=>`<button class="fass" data-a="${a}" style="background:${ART[a]}">${a}</button>`).join('')}</div></div>`);
 note('kruemel','Welcher Artikel passt?');speak(w.w,'kruemel');
 $$('.fass').forEach(b=>b.onclick=()=>{if(lock)return;
  if(b.dataset.a===w.a){lock=true;$('#ball').textContent=w.a+' '+w.w;$('#ball').style.background=ART[w.a];speak(w.a+' '+w.w,'kruemel');setTimeout(res,1300)}
  else{b.classList.add('shake');b.disabled=true;note('kruemel',pick(WRONG))}})})}
function schatz(){return new Promise(res=>{const ws=WORDS,n=ws.filter(w=>lvl(w)>=2).length;
 panel(`<div class="ptitle">Wörter-Schatzkiste <span style="font-size:24px;color:#3a2c20">${n} von ${ws.length} Wörtern sitzen</span></div>
 <div style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px">${ws.map(w=>{const l=lvl(w);return `<span style="font-size:22px;padding:4px 10px;border-radius:10px;border:2px solid ${l>=2?'#4f9a4a':l?'#c98f1f':'#cbb892'};background:${l>=2?'#bfe6b0':l?'#fbe3a0':'#fff'}">${l>=2?'★ ':''}${w.w}</span>`}).join('')}</div>
 <div style="font-size:24px;margin-bottom:10px">Was willst du üben?</div><div class="lrow" style="flex-wrap:wrap;gap:16px">${[1,2,3,0].map(k=>`<button class="btn${k?' sec':''}" data-k="${k}" style="font-size:24px">${BLATT[k]}</button>`).join('')}<button class="btn small" id="sz-x">Zurück</button></div>`);
 note('kruemel','Grün mit Stern heißt: Das Wort sitzt! Welche Wörter willst du üben?');
 $$('[data-k]').forEach(b=>b.onclick=()=>res(+b.dataset.k));$('#sz-x').onclick=()=>res(-1)})}
async function training(){busy=true;$('#b-home').style.display='none';
 if(!S.mw)S.mw={};
 await brief('Hier übst du die Wörter für deinen Test. Bei jedem Wort setzt du erst das fehlende Stück ein. Dann schreibst du es auf Papier. Hol dir Papier und einen Stift!');
 for(;;){const k=await schatz();if(k<0)break;
  const src=WORDS.filter(w=>!k||w.l===k);
  const ws=src.map(w=>[lvl(w)*10+Math.random()*9,w]).sort((a,b)=>a[0]-b[0]).slice(0,6).map(x=>x[1]);
  for(let i=0;i<ws.length;i++){const w=ws[i],t=`Wort ${i+1} von ${ws.length}`;
   const g=await gapOne(w,t);if(w.a)await artOne(w);const ok=await logOne(w,t);
   S.mw[w.w]=(g&&ok)?(S.mw[w.w]||0)+1:Math.min(S.mw[w.w]||0,1);save();
   if(S.mw[w.w]===2&&g&&ok)await talk('kruemel',`Kräh! „${w.w}“ sitzt jetzt! Ab in die Schatzkiste!`);
   else if(!ok)await talk('kruemel','Macht nichts! Das Wort kommt bald nochmal dran.')}
  S.coins+=5;save();await talk('kruemel','Super geübt! Du bekommst 5 Dublonen.')}
 closePanel();busy=false;idle();showTitle()}

/* ---------- Hafen ---------- */
let busy=false,mx=600;const POS={kapitaen:320,kruemel:400,kisten:500,kanonen:735,kompass:915,tuer:1110};
function walkTo(x){return new Promise(res=>{const d=Math.abs(x-mx),m=$('#mor');if(d<6)return res();
 $('#morflip').setAttribute('transform',`scale(${x<mx?-.85:.85},.85)`);m.classList.add('walk');
 m.style.transition=`transform ${d*2.6}ms linear`;m.style.transform=`translate(${x}px,588px)`;mx=x;
 setTimeout(()=>{m.classList.remove('walk');res()},d*2.6+40)})}
const JOKES=['Was ist grün und klopft an die Tür? Ein Klopfsalat!','Wie nennt man einen Keks unter einem Baum? Ein schattiges Plätzchen!','Was machen Piraten am Computer? Sie drücken die Enter-Taste!'];
const replay=async t=>!S.done[t]||await talk('kruemel','Das hast du schon geschafft! Willst du nochmal üben?',['Ja!','Nein'])===0;
const ACT={
 async kapitaen(){const d=S.done;
  if(d.karte&&!d.logbuch){await talk('kapitaen','Mmmh, lecker! Und mein Kartenstück ist auch da!');
   await talk('kapitaen','Aber ich vergesse immer alles. Schreib die wichtigen Wörter in dein Logbuch!');
   await brief('Hol dir Papier und einen Stift. Du siehst ein Wort. Dann ist es weg. Schreib es auf dein Papier.');
   await logbuch(6);S.done.logbuch=1;save();await ending()}
  else if(d.logbuch){if(await talk('kapitaen','Ahoi Moritz! Wollen wir nochmal ins Logbuch schreiben?',['Ja!','Nein'])===0)await logbuch(6)}
  else await talk('kapitaen',['kisten','kanonen','kompass'].every(k=>d[k])?'Du hast Dublonen! Geh zu Olga in die Kneipe.':'Verdiene dir erst Dublonen im Hafen. Tippe auf die Ausrufezeichen!')},
 async kruemel(){await talk('kruemel',pick(JOKES))},
 async kisten(){if(await replay('kisten'))await kisten()},
 async kanonen(){if(await replay('kanonen'))await kanonen()},
 async kompass(){if(await replay('kompass'))await kompass()},
 async tuer(){if(['kisten','kanonen','kompass'].every(k=>S.done[k]))await pub();
  else await talk('olga','Halt! Ohne Dublonen gibt es nichts. Erledige erst alle drei Aufgaben im Hafen!')}};
async function act(id){if(busy)return;busy=true;$('#b-home').style.display='none';
 try{await walkTo(POS[id]);await ACT[id]()}finally{closePanel();busy=false;idle()}}
async function intro(){busy=true;$('#b-home').style.display='none';
 await talk('kapitaen','Ahoi! Ich bin Kapitän Rechenbart. Du bist bestimmt Moritz, mein neuer Schiffsjunge!');
 await talk('kapitaen','Ich habe meine Schatzkarte in fünf Stücke gerissen und gut versteckt. Zu gut! Ich weiß nicht mehr, wo.');
 await talk('kruemel','Kräh! Ich bin Krümel. Der Kapitän vergisst alles. Sogar die Kekse in seinem Bart!');
 await talk('kapitaen','Ein Stück hat Wirtin Olga in der Kneipe. Aber ohne Dublonen gibt sie nichts her.');
 await talk('kruemel','Verdiene dir Dublonen im Hafen! Tippe auf die Ausrufezeichen.');
 S.done.intro=1;busy=false;idle()}
async function ending(){panel(`<div class="log"><div class="bigmsg">Kapitel 1 geschafft!</div>${MAP}<div class="ltext">Bald geht es weiter: Die Hexenhütte.</div></div>`);
 await talk('kapitaen','Bravo, Moritz! Ein Kartenstück haben wir. Vier fehlen noch. Das nächste hat die Hexe Mixa!',['Juhu!'])}

/* ---------- Start, Eltern ---------- */
function goFull(){try{const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;
 if(f&&!(document.fullscreenElement||document.webkitFullscreenElement)){const r=f.call(d,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}}catch(e){}}
function showTitle(){const t=$('#title');t.style.display='';
 t.innerHTML=`<svg viewBox="0 0 1280 800"><g transform="translate(190,720) scale(1.7)">${moritz()}</g><g transform="translate(1090,640) scale(2.2)">${kruemel()}</g><rect x="1080" y="640" width="20" height="160" fill="#6d4a26"/></svg>
 <h1>Die Insel von<br>Kapitän Rechenbart<small>Kapitel 1: Der Hafen</small></h1>
 <div class="tbtns"><button class="btn big" id="t-go">${S.done.intro?'Weiter spielen':'Spielen'}</button><button class="btn sec" id="t-log">Lernwörter üben</button></div>
 <button class="btn small" id="pbtn">Eltern</button>`;
 $('#t-go').onclick=()=>{goFull();t.style.display='none';speak(' ','moritz');idle();if(!S.done.intro)intro()};
 $('#t-log').onclick=()=>{goFull();t.style.display='none';speak(' ','moritz');training()};
 $('#pbtn').onclick=eltern}
function eltern(){const e=$('#eltern');e.style.display='flex';
 const wack=Object.keys(S.log).filter(w=>S.log[w][1]>0).sort((a,b)=>S.log[b][1]-S.log[a][1]).map(w=>`${w} (${S.log[w][1]}×)`).join(', ')||'noch keine';
 e.innerHTML=`<div class="ecard"><h2>Elternbereich</h2><label><input type="checkbox" id="e-sp"${S.speak?' checked':''}>Vorlesen (Sprachausgabe)</label>
 <div>Deutsche Stimme auf diesem Gerät: <b>${!hasTTS?'keine Sprachausgabe':voice?'gefunden':'nicht gefunden (Gerätestimme wird versucht)'}</b></div>
 <p style="margin:14px 0 4px"><b>Lernwörter</b></p>${[[1,'Faltblatt 1 (x, chs, ks)'],[2,'Faltblatt 2 (Sp, St)'],[3,'Faltblatt 3 (Farben und mehr)']].map(l=>`<label><input type="checkbox" class="e-l" value="${l[0]}"${S.lists.includes(l[0])?' checked':''}>${l[1]}</label>`).join('')}
 <p style="margin:14px 0 4px"><b>Wackelwörter aus dem Logbuch:</b> ${wack}</p><p style="margin:4px 0"><b>Training:</b> ${WORDS.filter(w=>lvl(w)>=2).length} von ${WORDS.length} Wörtern sitzen (zweimal fehlerfrei)</p>
 <div class="lrow"><button class="btn small" id="e-t">Stimme testen</button><button class="btn small" id="e-r">Spielstand löschen</button><button class="btn" id="e-c">Fertig</button></div></div>`;
 $('#e-sp').onchange=x=>{S.speak=x.target.checked;setTon();save()};
 $$('.e-l').forEach(c=>c.onchange=()=>{const v=$$('.e-l').filter(x=>x.checked).map(x=>+x.value);if(!v.length){c.checked=true;return}S.lists=v;save()});
 $('#e-t').onclick=()=>{loadVoice();speak('Ahoi! Ich bin Krümel, der Papagei.','kruemel')};
 let sure=false;$('#e-r').onclick=x=>{if(!sure){sure=true;x.target.textContent='Wirklich löschen? Nochmal tippen';return}
  S={coins:0,done:{},lists:S.lists,speak:S.speak,log:{},mw:{}};save();mx=600;build();e.style.display='none';showTitle()};
 $('#e-c').onclick=()=>{e.style.display='none'}}
function setTon(){$('#b-ton').textContent='Vorlesen: '+(S.speak?'an':'aus')}
function build(){$('#scene').innerHTML=HARBOR+PUB;$$('.hot').forEach(h=>h.onclick=()=>act(h.dataset.act))}
$('#b-ton').onclick=()=>{S.speak=!S.speak;if(!S.speak)hush();setTon();save()};
$('#b-home').onclick=()=>{if(!busy){hush();showTitle()}};
let lastW=0,lastH=0;
function fit(){const w=innerWidth,h=innerHeight;if(w===lastW&&h===lastH)return;lastW=w;lastH=h;
 const port=h>w,s=port?Math.min(h/1280,w/800):Math.min(w/1280,h/800);
 $('#stage').style.transform=`translate(-50%,-50%)${port?' rotate(90deg)':''} scale(${s})`}
addEventListener('resize',fit);addEventListener('orientationchange',()=>{setTimeout(fit,100);setTimeout(fit,500)});setInterval(fit,700);fit();build();setTon();idle();showTitle();
</script>
</body>
</html>

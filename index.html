.satz{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:70px 0 40px}

.kessel{display:flex;flex-direction:column;align-items:center;gap:18px;width:560px;flex:none}
.flaschen{display:flex;gap:20px}
.fl{font:inherit;font-size:30px;font-weight:700;color:#2b2a33;width:150px;height:150px;border-radius:26px 26px 60px 60px;border:5px solid #2b2a33;box-shadow:0 6px 0 #2b2a33}

.newp{transform-box:fill-box;transform-origin:center;animation:pin 1.5s ease-out}
@keyframes pin{from{transform:scale(4) rotate(-540deg);opacity:0}}
.lese{font-size:44px;line-height:1.5;margin:14px 10px 20px;min-height:380px}

.dgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:26px 0}
.dw{font:inherit;font-size:40px;font-weight:700;padding:10px 24px;border-radius:14px;border:3px solid #a9793f;background:#fff;color:#2b2a33}
.dw.good{background:#bfe6b0;border-color:#4f9a4a}
.ohr{font-size:120px;line-height:1}
#hudnav{display:flex;gap:10px}
.frage{font-size:48px;font-weight:700;text-align:center;margin:50px 0 36px}
.copts{display:flex;gap:26px;justify-content:center;margin-bottom:24px}
.copts.col{flex-direction:column;align-items:center;gap:16px}
.copt{font-size:40px}.col .copt{font-size:30px;min-width:920px}
.goodb{background:#bfe6b0!important}
.nw{font:inherit;font-size:44px;font-weight:700;padding:14px 26px;border-radius:40px;border:4px solid #3b78c4;background:#dff0fb;color:#2b2a33}
.nw.good{background:#bfe6b0;border-color:#4f9a4a}
.splank{font:inherit;font-size:40px;font-weight:700;min-width:104px;padding:16px 10px;border:4px solid #8c6234;border-radius:8px;background:#d9a55a;color:#2b2a33}
.srow{display:flex;gap:14px;justify-content:center;min-height:96px;margin:26px 0}
.fwrap{display:flex;gap:18px}.fpic{width:595px;height:436px;border:4px solid #2b2a33;border-radius:10px}
.mzwrap{display:flex;gap:30px;align-items:center;justify-content:center}
.mzpad{display:grid;grid-template-columns:repeat(3,96px);grid-auto-rows:96px;gap:8px}
.mzpad button{font:inherit;font-size:44px;border-radius:16px;border:3px solid #2b2a33;background:#f6c84a;box-shadow:0 5px 0 #2b2a33}
.orte{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:20px}

.kap12 .btn{font-size:21px;padding:10px 6px;min-width:0}.kap12 .btn:disabled{opacity:.4}
.ecard.breit{width:1180px;display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;font-size:22px}
.ecard.breit h2,.ecard.breit .lrow{grid-column:1/3}.ecard select{font:inherit;font-size:21px;padding:4px 8px;max-width:100%}
.orte .btn{min-width:560px}.orte .btn:disabled{opacity:.4}
#credits{position:absolute;inset:0;background:#1d1826cc;overflow:hidden;color:#fbeed3;text-align:center}
.roll{position:absolute;left:0;right:0;top:0;font-size:38px;line-height:1.6;animation:roll 30s linear forwards}
.roll h2{font-size:64px;color:#f6c84a;margin:0 0 30px}.roll p{margin:0 0 34px}.roll small{display:block;font-size:26px;color:#f6c84a}
@keyframes roll{from{transform:translateY(800px)}to{transform:translateY(-100%)}}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.ware{font:inherit;background:#fff;border:3px solid #a9793f;border-radius:16px;padding:8px 6px 10px;text-align:center;color:#2b2a33}
.ware svg{width:92px;height:92px;display:block;margin:0 auto}
.ware b{display:block;font-size:24px}.ware span{font-size:22px}
.ware.hat{background:#bfe6b0;border-color:#4f9a4a}
.fg,.bgd{pointer-events:none}
.drift{animation:drift 70s linear infinite}@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1400px)}}
.wippe{transform-box:fill-box;transform-origin:50% 100%;animation:wippe 2.6s ease-in-out infinite}@keyframes wippe{50%{transform:rotate(5deg)}}
.krabbe{animation:krab 16s linear infinite alternate}@keyframes krab{to{transform:translateX(240px)}}
.blink{animation:blink 2.4s infinite}@keyframes blink{50%{opacity:.15}}
.spinne{animation:spi 5s ease-in-out infinite alternate}@keyframes spi{to{transform:translateY(90px)}}
/* Figuren: Blinzeln, Zwinkern, Schmunzeln, Schwanzwedeln */
.aug,.zwink,.schmunzel{transform-box:fill-box;transform-origin:center}
.aug{animation:aug 4.6s infinite}@keyframes aug{0%,95%,100%{transform:none}97.5%{transform:scaleY(.1)}}
.zwink{animation:zwink 13s infinite}@keyframes zwink{0%,60%,67%,100%{transform:none}61.5%,65.5%{transform:scaleY(.1)}}
.schmunzel{animation:schmunzel 13s infinite}@keyframes schmunzel{0%,59%,68%,100%{transform:none}61%,66%{transform:scale(1.3,1.15) rotate(-6deg)}}
.wedel{transform-origin:20px -26px;animation:wedel 5.5s infinite}@keyframes wedel{0%,70%,92%,100%{transform:none}74%,82%{transform:rotate(22deg)}78%,86%{transform:rotate(-8deg)}}
/* Duell-Bühne: Reaktionen */
.buehne svg{display:block;width:420px;height:300px;margin-top:0}
.hops{transform-box:fill-box;transform-origin:50% 100%;animation:hops .45s 2}@keyframes hops{50%{transform:translateY(-26px)}}
.seufz{transform-box:fill-box;transform-origin:50% 100%;animation:seufz 1.1s}@keyframes seufz{35%{transform:scaleY(.92) rotate(-3deg)}70%{transform:scaleY(.97)}}
.grr{animation:shake .45s 2}
.zitter{animation:zitter .12s 10}
/* Krümel flattert beim Sprechen (Porträt) und ab und zu in der Szene */
.fluegel{transform-box:fill-box;transform-origin:50% 15%;animation:fluegel 9s infinite}@keyframes fluegel{0%,90%,100%{transform:none}92%,96%{transform:rotate(-40deg)}94%,98%{transform:rotate(5deg)}}
.port .fluegel{animation:flatter .16s 6 alternate}@keyframes flatter{to{transform:rotate(-40deg)}}
/* Moritz im Rechenfenster */
.numl{position:relative}.mini{position:absolute;right:6px;bottom:0;width:150px;height:300px;pointer-events:none}
#panel>.mini{right:30px;height:260px;width:130px}
/* Während einer Aufgabe: Szene dahinter anhalten, Figuren im Fenster nur bei Reaktion bewegen */
body.aufgabe #scene,body.aufgabe #scene *{animation-play-state:paused!important}
#panel .aug,#panel .zwink,#panel .schmunzel,body.aufgabe #bar .aug,body.aufgabe #bar .zwink,body.aufgabe #bar .schmunzel{animation:none}.mini svg{width:100%;height:100%;display:block}
/* Tiere in den Szenen */
.flap{transform-box:fill-box;transform-origin:center;animation:flap .35s infinite alternate ease-in-out}@keyframes flap{to{transform:scaleY(-.5)}}
.flatt{transform-box:fill-box;transform-origin:center;animation:flatt .2s infinite alternate}@keyframes flatt{to{transform:scaleX(.25)}}
.flug{animation:flug 28s linear infinite}@keyframes flug{0%{transform:translate(-80px,0)}45%,100%{transform:translate(1400px,-50px)}}
.sprung{animation:sprung 9s infinite}@keyframes sprung{0%,80%{transform:translate(-40px,30px) rotate(-50deg);opacity:0}81%{transform:translate(-40px,8px) rotate(-50deg);opacity:1}88%{transform:translate(0,-60px) rotate(0)}95%{transform:translate(40px,8px) rotate(50deg);opacity:1}96%,100%{transform:translate(40px,30px) rotate(50deg);opacity:0}}
.platsch{transform-box:fill-box;transform-origin:center;animation:platsch 9s infinite}@keyframes platsch{0%,94%{transform:scale(.2);opacity:0}96%{opacity:.8}100%{transform:scale(1.4);opacity:0}}
.flosse{animation:flosse 26s linear infinite}@keyframes flosse{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(300px) scaleX(1)}50%{transform:translateX(300px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.ffisch{animation:ffisch 12s infinite}@keyframes ffisch{0%,72%{transform:translate(0,0);opacity:0}73%{transform:translate(0,0);opacity:1}82%{transform:translate(190px,-80px)}91%{transform:translate(380px,-10px);opacity:1}92%,100%{transform:translate(380px,0);opacity:0}}
.gaukeln{animation:gaukeln 17s ease-in-out infinite}@keyframes gaukeln{20%{transform:translate(120px,-40px)}40%{transform:translate(220px,20px)}60%{transform:translate(140px,70px)}80%{transform:translate(40px,30px)}}
.kreisen{animation:kreisen 9s linear infinite}@keyframes kreisen{25%{transform:translate(120px,-50px)}50%{transform:translate(240px,0)}75%{transform:translate(120px,40px)}}
.pendel{transform-box:fill-box;transform-origin:50% 0;animation:pendel 3.2s ease-in-out infinite alternate}@keyframes pendel{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.tropfen{animation:tropfen 5s infinite}@keyframes tropfen{0%,60%{transform:translateY(0);opacity:0}62%{opacity:1}78%{transform:translateY(260px);opacity:1}79%,100%{transform:translateY(260px);opacity:0}}
.schwarm{animation:schwarm 32s linear infinite}@keyframes schwarm{0%{transform:translateX(-260px)}60%,100%{transform:translateX(1480px)}}
.blase{animation:blase 6s linear infinite}@keyframes blase{0%{transform:translateY(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-320px);opacity:0}}
.qualle{transform-box:fill-box;transform-origin:50% 0;animation:qualle 4s ease-in-out infinite alternate}@keyframes qualle{from{transform:translateY(0) scaleY(1)}to{transform:translateY(-40px) scaleY(.9)}}
.atmen{transform-box:fill-box;transform-origin:50% 100%;animation:atmen 2.8s ease-in-out infinite alternate}@keyframes atmen{to{transform:scaleY(1.07)}}
.katzauge{animation:katzauge 12s infinite}@keyframes katzauge{0%,80%,93%,100%{opacity:0}82%,91%{opacity:1}}
.katzschwanz{transform-origin:-44px -12px;animation:katzschwanz 7s infinite}@keyframes katzschwanz{0%,70%,100%{transform:none}76%,88%{transform:rotate(25deg)}82%{transform:rotate(-10deg)}}
.zzz{animation:zzz 4s linear infinite}@keyframes zzz{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}100%{transform:translate(14px,-46px);opacity:0}}
.krabbeln{animation:krabbeln 11s ease-in-out infinite}
/* Einmalige Überraschungen je Szene (laufen nur einmal je Reise) */
.u-auf{animation:uAuf 8s ease-in-out both}@keyframes uAuf{0%{transform:translate(780px,390px) scale(.3);opacity:0}8%{opacity:1}25%{transform:translate(780px,300px) scale(1)}40%{transform:translate(800px,290px) rotate(6deg)}55%{transform:translate(760px,295px) rotate(-6deg)}70%{transform:translate(780px,280px) rotate(0)}100%{transform:translate(1450px,-120px) rotate(-10deg)}}
.u-platsch{transform-box:fill-box;transform-origin:center;animation:uPlatsch 1.6s ease-out both}@keyframes uPlatsch{from{transform:scale(.2);opacity:.9}to{transform:scale(1.8);opacity:0}}
.u-flug{animation:uFlug 7s ease-in-out both}@keyframes uFlug{0%{transform:translate(-120px,140px)}25%{transform:translate(300px,90px) rotate(-8deg)}45%{transform:translate(620px,160px) rotate(8deg)}52%,62%{transform:translate(700px,150px) rotate(0)}80%{transform:translate(1000px,60px)}100%{transform:translate(1450px,20px)}}
.u-strahl{animation:uStrahl 7s both}@keyframes uStrahl{0%,50%,64%,100%{opacity:0}53%,61%{opacity:.55}}
.u-maus{animation:uMaus 4.5s linear both}@keyframes uMaus{0%{transform:translate(1330px,420px)}100%{transform:translate(-90px,420px)}}

let voice=null;const hasTTS='speechSynthesis' in window;
/* Deutsche Stimmen des Geräts. Gewählte Stimme steht in S.stimme (Name), sonst wird die vermutlich beste genommen. */
const deVoices=()=>{try{return speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang))}catch(e){return[]}};
const voiceRang=v=>(/neural|natural|premium|enhanced|wavenet|online/i.test(v.name)?4:0)+(/google/i.test(v.name)?2:0)+(/de-DE/i.test(v.lang)?1:0);
function loadVoice(){const L=deVoices();voice=L.find(v=>v.name===S.stimme)||L.slice().sort((a,b)=>voiceRang(b)-voiceRang(a))[0]||null}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
/* ---------- Aufgenommene Stimmen (stimmen/<figur>/<schlüssel>.mp3) ----------
   Schlüssel = FNV-1a über "figur|text" (Text ohne HTML, Leerraum zusammengefasst). Gleiche Rechnung in
   tools/stimmen.py. Fehlt eine Aufnahme, spricht die Gerätestimme und der Satz landet in der Fehlliste. */
const stimmText=t=>String(t).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
function stimmKey(who,text){const t=who+'|'+stimmText(text);let h=0x811c9dc5;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return who+'/'+h.toString(16).padStart(8,'0')}
const HAT_STIMME=typeof STIMMEN!=='undefined'?new Set(STIMMEN):new Set();
let clip=null;const FKEY='rechenbart-fehlt';
function fehlt(who,text){const t=stimmText(text);if(!/[a-zäöüß]{2}/i.test(t))return;try{const L=JSON.parse(localStorage.getItem(FKEY)||'[]'),e=who+'|'+t;if(!L.includes(e)&&L.length<800){L.push(e);localStorage.setItem(FKEY,JSON.stringify(L))}}catch(e){}}
function hush(){if(clip){try{clip.pause()}catch(e){}clip=null}if(hasTTS)try{speechSynthesis.cancel()}catch(e){}}
function speakTTS(text,who,onword){if(!hasTTS)return;
 try{const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.9;u.pitch=PITCH[who]||1;
 if(onword)u.onboundary=e=>onword(e.charIndex);speechSynthesis.speak(u)}catch(e){}}
function speak(text,who,onword){hush();if(!S.speak)return;who=who||'kruemel';
 const k=stimmKey(who,text);
 if(S.aufnahmen!==false&&HAT_STIMME.has(k)){const a=new Audio('stimmen/'+k+'.mp3');clip=a;
  /* Wort-Markierung grob über die Abspielzeit */
  if(onword)a.ontimeupdate=()=>{if(a.duration)onword(Math.floor(a.currentTime/a.duration*String(text).length))};
  a.onerror=()=>{if(clip===a){clip=null;speakTTS(text,who,onword)}};
  a.play().catch(()=>{if(clip===a){clip=null;speakTTS(text,who,onword)}});return}
 if(S.aufnahmen!==false&&HAT_STIMME.size)fehlt(who,text);
 speakTTS(text,who,onword)}

let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,at,d,type,vol,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+d);
 g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(vol||.09,at+.015);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+.03)}
function rausch(at,d,vol){const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const q=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;g.gain.value=vol;q.buffer=b;q.connect(f);f.connect(g);g.connect(AC.destination);q.start(at)}
function sfx(k){if(S.sound===false||!ac())return;const t=AC.currentTime+.01;try{
 if(k==='ok'){tone(523,t,.12);tone(659,t+.1,.12);tone(784,t+.2,.22)}
 else if(k==='bad')tone(220,t,.28,'sawtooth',.07,140);
 else if(k==='coin'){tone(988,t,.08);tone(1319,t+.08,.26)}
 else if(k==='splash')rausch(t,.55,.4);
 else if(k==='jump')tone(300,t,.2,'square',.07,720);
 else if(k==='kraeh'){tone(900,t,.12,'sawtooth',.07,600);tone(1000,t+.15,.2,'sawtooth',.07,480)}
 else if(k==='hatschi'){rausch(t,.4,.5);tone(700,t,.32,'sawtooth',.09,180)}
 else if(k==='fanfare')[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,t+[0,.12,.24,.36,.54,.72,.84,.96][i],i===7?.7:.14))}catch(e){}}

 [['B4',2],['B4',1],['A4',2],['G4',1],['E4',2],['G4',1],['E4',3],['C5',2],['C5',1],['B4',2],['A4',1],['D5',3],['D4',3]],A2);

const z=(a,b)=>rand(a,b)*10;

  clearTimeout(rt[w]);rt[w]=setTimeout(()=>{if(!g.isConnected)return;g.innerHTML=w==='m'?moritz():fig();g.removeAttribute('class')},1600)};
 return new Promise(res=>{let me=0,she=0,val='',lock=true,cur,to=null;const T=n===3?SAND():0;
 panel(`<div class="num"><div class="numl"><div class="ptitle">Rechen-Duell ${n}</div><div class="duel">

/* Rechengeschichten aus inhalte.js: [Rechenart, Text mit {a} und {b}]. stufen je Aufgabe: 'ze' = nur Zehnerzahlen, sonst mit Übergang */
/* Rechen-Stufe (Elternbereich, S.rechnen): leicht = nur Zehnerzahlen dazu/weg (Klassenstand), mittel = zweistellig ohne
   Übergang, schwer = mit Übergang. Aufgaben, die in index.html mit 'ze' markiert sind, bleiben immer Zehnerzahlen. */
const RSTUFE=()=>S.rechnen||'leicht';

 ohneM=()=>{let a,b;do{a=rand(35,98);b=rand(11,29)}while(a%10===0||b%10===0||a%10<b%10);return[a,b]};
const rGen=(op,ze)=>{const st=RSTUFE();if(ze||st==='leicht')return op==='+'?zeT:zeM;if(st==='mittel')return op==='+'?ohneP:ohneM;return op==='+'?genP:genM};

 harbor:TIER.moewe(0,110)+TIER.fisch(760,360,3),

 werft:TIER.moewe(0,130,9)+TIER.flosse(700,305),
 turm:TIER.moewe(0,140,14)+TIER.ffisch(160,400,4),
 see:TIER.flosse(470,345)+TIER.ffisch(560,330,7),
 affen:TIER.falter(380,160,'#f6c84a')+TIER.falter(700,120,'#8fc6e8',8),
 riff:TIER.schwarm(290)+TIER.blasen(60,400)+TIER.blasen(1220,400)+TIER.qualle(330,220),
 nebel:TIER.fledermaus(930,140),
 hoehle:TIER.haengt(720,40)+TIER.tropfen(220,190)+TIER.tropfen(1000,170,2.5)};
const leben=svg=>{const id=(svg.match(/^<svg id="(\w+)"/)||[])[1];return id?svg.replace(/<\/svg>\s*$/,`<g class="bgd">${LEBEN[id]||''}</g><g class="bgd" id="ue-${id}"></g></svg>`):svg};
/* ---------- Einmalige Überraschung je Szene ----------
   Startet, wenn Moritz in der Szene insgesamt etwa 8 Sekunden nichts zu tun hat (nie während Aufgaben,
   Gesprächen oder Spielen). Merkt sich S.done['ue_'+Szene], kommt also in jeder neuen Reise einmal wieder. */
const UFO=`<path class="u-strahl" d="M-20 10L-60 130H60L20 10z" fill="#f6f1a8"/><ellipse cx="0" cy="0" rx="60" ry="16" fill="#9aa3ad" stroke="#2b2a33" stroke-width="3"/><path d="M-30 -6q30 -40 60 0z" fill="#bfe6f0" stroke="#2b2a33" stroke-width="3"/><circle cx="0" cy="-16" r="9" fill="#8fc640"/><circle cx="-3" cy="-18" r="2" fill="#2b2a33"/><circle cx="3" cy="-18" r="2" fill="#2b2a33"/><circle cx="-36" cy="2" r="4" fill="#f6c84a"/><circle cx="0" cy="5" r="4" fill="#d24a43"/><circle cx="36" cy="2" r="4" fill="#4f9a4a"/>`;
const UEB={
 harbor:['Kräh! Ein Ufo! Das glaubt mir keiner.',8,`<ellipse class="u-platsch" cx="780" cy="385" rx="40" ry="10" fill="none" stroke="#fff" stroke-width="4"/><g class="u-auf u-main">${UFO}</g>`,'splash'],
 turm:['Kräh! Schon wieder ein Ufo? Die suchen bestimmt Kekse!',7,`<g class="u-flug u-main">${UFO}</g>`],
 pub:['Kräh! Eine Maus! Und die Katze schläft einfach weiter.',4.5,`<g class="u-maus u-main"><g class="u-trippel"><g transform="scale(1.6)"><path d="M16 -6q30 -4 34 -20" stroke="#5f6670" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="-10" rx="18" ry="11" fill="#6f7680"/><circle cx="-16" cy="-16" r="7" fill="#6f7680"/><circle cx="-12" cy="-24" r="6" fill="#c9a0a8" stroke="#6f7680" stroke-width="2"/><circle cx="-21" cy="-17" r="1.8" fill="#2b2a33"/><circle cx="-24" cy="-13" r="2" fill="#d98a8a"/></g></g></g>`],
 hexe:['Kräh! Mixas Besen fliegt mal wieder allein.',6,`<g class="u-besen u-main"><path d="M-80 0h100" stroke="#8c6234" stroke-width="7" stroke-linecap="round"/><path d="M20 -6l54 -14v40l-54 -14z" fill="#d9a55a" stroke="#2b2a33" stroke-width="2"/><g fill="#f6c84a"><circle cx="96" cy="-10" r="4"/><circle cx="120" cy="8" r="3"/><circle cx="146" cy="-4" r="2.5"/></g></g>`],
 werft:['Kräh! Ein Wal! Und er macht eine Dusche.',7,`<g class="u-wal u-main"><path d="M-70 0q40 -46 110 -10q20 10 30 10z" fill="#3d5a80"/><circle cx="-36" cy="-14" r="3" fill="#fff"/><path class="u-fontaene" d="M10 -32q-6 -40 -26 -50M10 -32q0 -46 0 -62M10 -32q6 -40 26 -50" stroke="#e8f6ff" stroke-width="5" fill="none" stroke-linecap="round"/></g>`,'splash'],
 see:['Kräh! Eine Seeschlange! Zum Glück ist sie freundlich.',8,`<g class="u-schlange u-main">${[0,70,140].map((x,i)=>`<path class="u-bogen" style="animation-delay:-${i*.25}s" d="M${x} 0q20 -40 40 0" stroke="#4f9a4a" stroke-width="12" fill="none" stroke-linecap="round"/>`).join('')}<path d="M-6 0q0 -30 -26 -30" stroke="#4f9a4a" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="-38" cy="-32" r="15" fill="#4f9a4a"/><circle cx="-44" cy="-36" r="3" fill="#2b2a33"/><path d="M-50 -24q6 4 12 0" stroke="#2b2a33" stroke-width="2" fill="none"/></g>`,'splash'],
 affen:['Uh uh ah ah! Ein Affe an der Liane!',4,`<g class="u-liane u-main"><path d="M640 -300V210" stroke="#3f7a4a" stroke-width="5"/><g transform="translate(640,300) scale(.75)">${moki()}</g></g>`],
 riff:['Blubb! Ein gelbes U-Boot. Wer sitzt da wohl drin?',10,`<g class="u-uboot u-main"><path d="M-70 0l-22 -16v32z" fill="#e0ae1f" stroke="#2b2a33" stroke-width="2"/><rect x="-70" y="-24" width="140" height="48" rx="24" fill="#f6c84a" stroke="#2b2a33" stroke-width="3"/><rect x="-20" y="-44" width="40" height="22" rx="6" fill="#f6c84a" stroke="#2b2a33" stroke-width="3"/><path d="M0 -44v-18h14" stroke="#2b2a33" stroke-width="4" fill="none"/>${[-30,0,30].map(x=>`<circle cx="${x}" cy="0" r="9" fill="#bfe6f0" stroke="#2b2a33" stroke-width="3"/>`).join('')}<g fill="none" stroke="#e8f6ff" stroke-width="2.5"><circle class="blase" cx="-100" cy="-6" r="5"/><circle class="blase" style="animation-delay:-2s" cx="-110" cy="4" r="4"/></g></g>`],
 nebel:['Kräh! Ein Geisterschiff! Mir zittern die Federn.',10,`<g class="u-geist u-main"><path d="M-90 0h180l-30 40h-120z" fill="#c9d1e0"/><path d="M0 0v-130" stroke="#c9d1e0" stroke-width="6"/><path d="M4 -126q50 30 0 60zM4 -60q40 20 0 50z" fill="#c9d1e0"/><path d="M-60 14h20M-10 14h20M40 14h20" stroke="#5a6478" stroke-width="5" stroke-linecap="round"/></g>`],
 hoehle:['Kräh! So viele Fledermäuse! Kopf einziehen!',5.2,[0,1,2,3,4,5,6,7].map(i=>`<g class="u-fm${i===7?' u-main':''}" style="animation-delay:${i*.28}s;--a:${180+i%3*40}px;--b:${20+i%4*30}px"><path class="flap" d="M0 0q-10 -12 -26 -8q6 6 4 12q-8 -2 -12 4q14 0 34 -8zM0 0q10 -12 26 -8q-6 6 -4 12q8 -2 12 4q-14 0 -34 -8z" fill="#1d1c22"/><circle cx="0" cy="-1" r="6" fill="#1d1c22"/></g>`).join('')]};
const UEZ={};let ueSc='';
function ueRuhig(){const v=s=>{const e=$(s);return e&&getComputedStyle(e).display!=='none'};return !busy&&!v('#title')&&!v('#panel')&&!v('#cine')&&!v('#eltern')&&!$('#bar .btn')&&!document.hidden}
function ueberraschung(n){const u=UEB[n],g=$('#ue-'+n);if(!u||!g)return;S.done['ue_'+n]=1;save();
 g.innerHTML=u[2];if(u[3])sfx(u[3]);const m=g.querySelector('.u-main');if(m)m.addEventListener('animationend',e=>{if(e.target===m)g.innerHTML=''},{once:false});
 setTimeout(()=>{if(S.scene!==n||!ueRuhig())return;sfx('kraeh');note('kruemel',u[0]);setTimeout(()=>{const t=$('#bar .tx'),k=x=>x.replace(/\s+/g,'');if(ueRuhig()&&t&&k(t.textContent)===k(u[0]))idle()},5000)},Math.min(2500,u[1]*400))}
setInterval(()=>{const n=S.scene;if(!UEB[n]||S.done['ue_'+n]||!ueRuhig())return;UEZ[n]=(UEZ[n]||0)+1;if(UEZ[n]>=8){UEZ[n]=0;ueberraschung(n)}},1000);
function build(){$('#scene').innerHTML=[HARBOR,PUB,HEXE,WERFT,TURM,HOEHLE,SEE,AFFEN,RIFF,NEBEL].map(leben).join('');setScene(SCN.includes(S.scene)?S.scene:'harbor');$$('.hot').forEach(h=>h.onclick=()=>act(h.dataset.act))}
$('#b-ton').onclick=()=>{S.speak=!S.speak;if(!S.speak)hush();setTon();save()};
$('#b-insel').onclick=insel;$('#b-home').onclick=()=>{if(!busy){hush();showTitle()}};
let lastW=0,lastH=0;
function fit(){const w=innerWidth,h=innerHeight;if(w===lastW&&h===lastH)return;lastW=w;lastH=h;
 const port=h>w,s=port?Math.min(h/1280,w/800):Math.min(w/1280,h/800);
 $('#stage').style.transform=`translate(-50%,-50%)${port?' rotate(90deg)':''} scale(${s})`}
addEventListener('resize',fit);addEventListener('orientationchange',()=>{setTimeout(fit,100);setTimeout(fit,500)});setInterval(fit,700);fit();build();setTon();idle();showTitle();
</script>
